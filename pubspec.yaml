name: converto
description: "Converto, convertisseur de fichiers 100 % local."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  cross_file: ^0.3.5+5
  csv: ^8.0.0
  ffmpeg_kit_flutter_new_full: ^2.5.7
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  gal: ^2.3.3
  image: ^4.12.0
  intl: ^0.20.3
  open_filex: ^5.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdfrx: ^2.9.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.1
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/OFL.txt

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: assets/icon/foreground.png
