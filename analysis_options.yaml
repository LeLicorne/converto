include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - lib/l10n/generated/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    unawaited_futures: error
    avoid_print: error
    unused_import: error
    dead_code: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - use_build_context_synchronously
    - use_super_parameters
